plugins {
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'

    base {
        // Set up a suffixed format for the mod jar names.
        archivesName = "$rootProject.archives_name-$project.name-mc$rootProject.minecraft_version"
    }

    repositories {
        mavenCentral()

        // Required by Cloth Config
        maven {
            url "https://maven.shedaniel.me/"
        }

        // Required by Mod Menu
        maven {
            url "https://maven.terraformersmc.com/releases/"
        }
    }

    dependencies {
        compileOnly("org.projectlombok:lombok:$rootProject.lombok_version")
        annotationProcessor("org.projectlombok:lombok:$rootProject.lombok_version")

        testCompileOnly("org.projectlombok:lombok:$rootProject.lombok_version")
        testAnnotationProcessor("org.projectlombok:lombok:$rootProject.lombok_version")

        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }
}
